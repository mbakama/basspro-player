<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BB86FC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6200EE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#03DAC6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#018786;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>
  
  <!-- Bass waveform visualization - 5 vertical bars of varying heights -->
  <!-- Left side - lower frequencies -->
  <rect x="100" y="180" width="40" height="152" rx="20" fill="url(#waveGradient)"/>
  <rect x="160" y="140" width="40" height="232" rx="20" fill="url(#waveGradient)"/>
  <rect x="220" y="100" width="40" height="312" rx="20" fill="url(#waveGradient)"/>
  
  <!-- Right side - higher frequencies -->
  <rect x="280" y="140" width="40" height="232" rx="20" fill="url(#waveGradient)"/>
  <rect x="340" y="180" width="40" height="152" rx="20" fill="url(#waveGradient)"/>
  
  <!-- Play button overlay in center -->
  <circle cx="256" cy="256" r="60" fill="#FFFFFF" opacity="0.95"/>
  <path d="M 236 226 L 236 286 L 286 256 Z" fill="#6200EE"/>
</svg>
